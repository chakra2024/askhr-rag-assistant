# Tool settings only (this project is not packaged).

[tool.pytest.ini_options]
# Lets tests run "from src.load_documents import ..." from the project root.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W: style errors and warnings, F: real bugs (unused or undefined names),
# I: import order, B: common bug patterns.
select = ["E", "W", "F", "I", "B"]
